name: prove verify
description: Verify the prove records of a commit, and post what is recorded as the job summary.
author: jayehmke
branding:
  icon: check-circle
  color: green

inputs:
  commit:
    description: The commit to verify. Default github.sha, which on a pull request is the head merged into the base branch, so records of the head alone can't hide a break the base brings in (inputs the base changed are rerun or fail). Pass the head's sha to verify the branch alone.
    default: ${{ github.sha }}
  mode:
    description: verify only checks records. run is for a job that runs repo code and has no signing key. It runs the checks prove plan says have no valid record with prove run --unsigned, writes their results to the results folder and verifies nothing, so it fails only on a usage error (PROVE_SSH_KEY set, say). sign is for a later job that holds the key (PROVE_SSH_KEY, which the policy must trust) and runs no repo code. It signs those results with prove sign, then verifies without sampling.
    default: verify
  results:
    description: The folder run mode writes results to and sign mode reads them from. Upload it from the run job and download it in the sign job.
    default: ${{ runner.temp }}/prove-results
  args:
    description: More arguments for prove verify, such as --sample 10.
    default: ""
  version:
    description: The exact prove release to install, such as 1.2.0. Empty installs the release this action pins (action/VERSION). Never "latest".
    default: ""
  from-path:
    description: true uses a prove already on PATH instead of installing one. Only for runners you control; on a shared runner an earlier job can plant a prove that passes everything.
    default: "false"
  token:
    description: The token gh uses to read the release's build attestation.
    default: ${{ github.token }}
  fetch-records:
    description: Fetch refs/prove/* from origin first (where the git store keeps records).
    default: "true"
  working-directory:
    description: The repository to verify.
    default: "."

runs:
  using: composite
  steps:
    - name: Install prove
      shell: bash
      env:
        PROVE_VERSION: ${{ inputs.version }}
        PROVE_FROM_PATH: ${{ inputs.from-path }}
        GH_TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/install.sh"'
    - name: prove verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROVE_COMMIT: ${{ inputs.commit }}
        PROVE_MODE: ${{ inputs.mode }}
        PROVE_RESULTS: ${{ inputs.results }}
        PROVE_ARGS: ${{ inputs.args }}
        PROVE_FETCH_RECORDS: ${{ inputs.fetch-records }}
      run: '"$GITHUB_ACTION_PATH/verify.sh"'
