version: "2"
linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      # Writes to stdout/stderr and hash writers: nothing useful to do on error.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
formatters:
  enable:
    - gofmt
