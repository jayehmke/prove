name: Bug report
description: prove did something wrong or unexpected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If it is a security problem (for example,
        `prove verify` passing without a valid, trusted record), don't file it
        here: report it privately, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and its output.
      render: console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, a `.prove.yaml`, or a small repository that shows it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: prove version or commit
      description: And how you installed it (release binary, go install, the GitHub action).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, git version and CI
      placeholder: Ubuntu 24.04, git 2.43, GitHub Actions
