name: Bug report
description: prove did something wrong or unexpected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For a security vulnerability, please use
        private reporting instead (see SECURITY.md), not this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and its full output.
      render: console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest repository, `.prove.yaml` and commands that show it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: prove version
      description: The output of `prove version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, git version, and the CI system if any.
